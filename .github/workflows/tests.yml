name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Run tests
        run: luajit tests/run.lua

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download bob.jar
        run: |
          SHA1=$(curl -s https://d.defold.com/stable/info.json | jq -r .sha1)
          curl -sSL -o bob.jar "https://d.defold.com/archive/stable/${SHA1}/bob/bob.jar"
      - name: Build
        run: java -jar bob.jar --platform x86_64-linux --verbose build
